# Override pour Linux natif / WSL2 (Docker Engine, PAS Docker Desktop).
#
# network_mode: host — indispensable pour que :
#   - la RC (UDP 7777 depuis dji_host.py sur l'hôte) arrive à joy_bridge
#   - QGroundControl reçoive le MAVLink UDP 14550
# En réseau "bridge", 127.0.0.1 dans Docker n'est PAS le PC : les paquets
# n'arrivent jamais. Les `ports:` du compose principal sont alors ignorés.
#
# Vue 3D : socket X11 + auth copiée par scripts/start.sh vers ~/.docker-xauth.
#
# Utilisé automatiquement par scripts/start.sh et scripts/stop.sh.
services:
  sim:
    network_mode: host
    ports: !override []
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XDOCKER_XAUTH:-/dev/null}:/tmp/.docker-xauth:ro
    environment:
      - DISPLAY=${DISPLAY:-}
      - XAUTHORITY=/tmp/.docker-xauth
