name: drone-sim

services:
  # --- Simulateur moderne : SITL + Gazebo Harmonic + RViz + MAVROS + nodes ---
  sim:
    # Image pré-construite (publiée par GitHub Actions sur ghcr.io). Les scripts
    # start.sh / start.bat tentent d'abord `docker compose pull` : les étudiants
    # TÉLÉCHARGENT l'image au lieu de la compiler (build très long + dépôts
    # GitHub parfois lents). Si le pull échoue, `build:` ci-dessous reconstruit
    # localement. Surchargeable via la variable d'env SIM_IMAGE.
    image: ${SIM_IMAGE:-ghcr.io/rogshutter/drone_sim:latest}
    build:
      context: .          # racine du projet : le Dockerfile référence sim/ et ros/
      dockerfile: sim/Dockerfile
      args:
        ARDUPILOT_VERSION: ${ARDUPILOT_VERSION:-master}
        ROS2_APT_MIRROR: ${ROS2_APT_MIRROR:-http://packages.ros.org/ros2/ubuntu}
    container_name: drone-sim
    ports:
      - "5760:5760"        # MAVLink TCP (QGroundControl / MAVProxy)
      - "14550:14550/udp"  # MAVLink UDP (QGroundControl)
      - "7777:7777/udp"    # sticks RC-N1 (dji_host.py -> joy_bridge)
    volumes:
      - ./sim/models:/sim/models:ro
      - ./sim/worlds:/sim/worlds:ro
      - ./sim/config:/sim/config:ro   # params SITL (dont gazebo-x500.parm)
    environment:
      - DISPLAY=${DISPLAY:-}                 # vue 3D (RViz/Gazebo) via VcXsrv
      # Le dossier *share* d'ardupilot_gazebo (pas seulement models/) est
      # indispensable : les URI `package://ardupilot_gazebo/...` du modele iris
      # se resolvent depuis ce parent. Sans lui, Gazebo charge un monde vide.
      - GZ_SIM_RESOURCE_PATH=/sim/models:/sim/worlds:/root/ros2_ws/install/ardupilot_gazebo/share:/opt/gz_models/models
      - SDF_PATH=/root/ros2_ws/install/ardupilot_gazebo/share
      # Choix du drone : iris (défaut) ou x500. Ex. : FRAME=x500 docker compose up
      - FRAME=${FRAME:-iris}
      # Rendu CPU par défaut (software / llvmpipe) : marche partout, sans GPU.
      # L'overlay docker-compose.gpu.yml remet cette valeur à 0 quand un GPU
      # NVIDIA est détecté sous Linux (accélération matérielle de la 3D).
      - LIBGL_ALWAYS_SOFTWARE=1
    restart: unless-stopped
